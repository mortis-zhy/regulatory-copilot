name: Expand uploaded source

on:
  push:
    paths:
      - comparison_agent_source.zip

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand source archive
        run: |
          unzip -o comparison_agent_source.zip -d .
          rm comparison_agent_source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync source from sandbox" || echo "No source changes to commit"
          git push
