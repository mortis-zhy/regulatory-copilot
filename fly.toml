# fly.toml — Fly.io 部署配置
# 完全免费，无需信用卡。免费额度：3 shared-cpu-1x 256MB VM
app = "regulatory-copilot"
primary_region = "sin"   # 新加坡，国内速度可接受

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # 无人访问时停机，零成本
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0