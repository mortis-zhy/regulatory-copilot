<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>参数提议确认 · C 列（UN R48）</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2b303b;
    --fg: #e6e8ee; --dim: #98a0b3; --accent: #6aa9ff; --ok: #4ec98b;
    --warn: #e8b04b; --bad: #ef6f6f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 330px 1fr; height: calc(100vh - 53px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .filters { padding: 8px 10px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filters button {
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 9px; font-size: 12px; cursor: pointer;
  }
  .filters button.on { color: var(--fg); border-color: var(--accent); }
  .rowitem {
    padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
  }
  .rowitem:hover { background: var(--panel2); }
  .rowitem.on { background: #22304a; }
  .rowitem .nm { font-size: 13px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
  .tag.cand { background: #1d3a2c; color: var(--ok); }
  .tag.none { background: #3a2a1d; color: var(--warn); }
  .tag.done { background: #22304a; color: var(--accent); }
  #detail { overflow-y: auto; padding: 18px 22px; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .fam { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .abbox {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
  }
  .ab {
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px;
  }
  .ab b { display: block; font-size: 11px; color: var(--dim); font-weight: 400; }
  .ab span { font-size: 15px; font-family: Consolas, monospace; }
  .ab.c span { color: var(--warn); }
  section { margin-bottom: 18px; }
  section > h3 {
    font-size: 13px; margin: 0 0 8px; color: var(--accent);
    border-left: 3px solid var(--accent); padding-left: 7px;
  }
  .cand {
    border: 1px solid var(--line); border-radius: 5px; padding: 9px 11px; margin-bottom: 7px;
    background: var(--panel);
  }
  .cand.pick { border-color: var(--ok); background: #16241d; }
  .cand .meta { color: var(--dim); font-size: 11px; margin-bottom: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .cand .meta .star { color: var(--ok); }
  .cand .txt { font-size: 12px; color: #cfd4e0; font-family: Consolas, monospace; white-space: pre-wrap; }
  .cand .acts { margin-top: 7px; display: flex; gap: 6px; }
  button.act {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); }
  label { font-size: 12px; color: var(--dim); display: block; margin: 10px 0 3px; }
  textarea, input, select {
    width: 100%; background: #10131a; color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 8px; font: 12px/1.5 Consolas, monospace;
  }
  #why { font-family: inherit; }
  #foot {
    position: fixed; right: 0; bottom: 0; padding: 10px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px 0 0 0;
    display: flex; gap: 10px; align-items: center;
  }
  #msg { font-size: 12px; max-width: 60vw; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .empty { color: var(--dim); padding: 24px 0; }
  code { background: #10131a; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>参数提议确认 · C 列（UN R48）</h1>
  <span class="sub" id="hstat">载入中…</span>
  <span class="sub">宁可空着，不可错着 —— 采纳前请回原文核对条款号</span>
</header>
<main>
  <div id="list">
    <div class="filters" id="filters"></div>
    <div id="rows"></div>
  </div>
  <div id="detail"><div class="empty">选择左侧一行开始裁定。</div></div>
</main>
<div id="foot">
  <span id="msg"></span>
  <button class="act" id="clear">清空待采纳</button>
  <button class="act" id="save">保存并校验</button>
</div>

<script>
const $ = (s) => document.querySelector(s);
let DATA = null;
let cur = null;          // 当前行
let filter = "all";
const picked = new Map(); // id -> {id, source, flags, why, section}

/** 从候选句生成一条正则。
 *  锚点取句子自己前半段的 7 个词，值单独用捕获组框住 —— 两条硬约束：
 *  跨不了 [第N页] 标记，所以锚点必须够短；车型编号不能进 nums，所以只框值。 */
function makeSource(sentence, value) {
  const s = sentence.replace(/\s+/g, " ").trim();
  const i = s.indexOf(value);
  if (i < 0) return null;
  const prefix = s.slice(0, i).trim().replace(/[.,;:]+$/, "");
  const words = prefix.split(" ").filter(Boolean);
  const tail = words.length > 7 ? words.slice(-7) : prefix;
  if (!tail.length) return null;
  const anchor = tail.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+");
  return anchor + "[\\s\\S]{0,60}?(\\d+(?:[.,]\\d+)?\\s*" + guessUnit(sentence) + ")";
}

function guessUnit(s) {
  const m = s.match(/(\d+(?:[.,]\d+)?)\s*(mm|cd|cd\/mm2|°|lx|Hz|km\/h|s|mrad)\b/);
  return m ? m[2].replace("/", "\\/") : "mm";
}

function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function cellNums(row, v) {
  const c = DATA.cells[row.id]?.[v];
  return c && c.nums && c.nums.length ? c.nums.join(" / ") : "—";
}
function cellPage(row, v) {
  const c = DATA.cells[row.id]?.[v];
  return c ? `${c.page || ""} ${c.clause ? "§" + c.clause : ""}`.trim() : "";
}

function renderList() {
  const all = DATA.c.rows;
  const counts = {
    all: all.length,
    cand: all.filter((r) => r.candidates.length).length,
    none: all.filter((r) => !r.candidates.length).length,
    done: all.filter((r) => DATA.specs.find((s) => s.id === r.id)?.patterns?.C).length,
  };
  $("#filters").innerHTML = [
    ["all", `全部 ${counts.all}`],
    ["cand", `有候选 ${counts.cand}`],
    ["none", `无候选 ${counts.none}`],
    ["done", `已有 C ${counts.done}`],
  ].map(([k, t]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${t}</button>`).join("");
  $("#filters").onclick = (e) => { if (e.target.dataset.f) { filter = e.target.dataset.f; renderList(); } };

  const show = all.filter((r) => {
    if (filter === "cand") return r.candidates.length;
    if (filter === "none") return !r.candidates.length;
    if (filter === "done") return DATA.specs.find((s) => s.id === r.id)?.patterns?.C;
    return true;
  });
  $("#rows").innerHTML = show.map((r) => {
    const done = DATA.specs.find((s) => s.id === r.id)?.patterns?.C;
    const cls = done ? "done" : r.candidates.length ? "cand" : "none";
    const mark = picked.has(r.id) ? " ★" : "";
    return `<div class="rowitem ${cur && cur.id === r.id ? "on" : ""}" data-id="${esc(r.id)}">
      <span class="nm">${esc(r.name)}${mark}</span>
      <span class="tag ${cls}">${done ? "已有 C" : r.candidates.length ? r.candidates.length + " 条候选" : "无候选"}</span>
    </div>`;
  }).join("") || `<div class="empty">没有符合条件的行。</div>`;
  $("#rows").onclick = (e) => {
    const el = e.target.closest(".rowitem");
    if (el) { cur = DATA.c.rows.find((r) => r.id === el.dataset.id); renderList(); renderDetail(); }
  };
}

function renderDetail() {
  const r = cur;
  if (!r) return;
  const pk = picked.get(r.id);
  const opts = (r.sectionOptions || []).map(
    (s) => `<option value="${s.no}" ${s.no === r.section ? "selected" : ""}>§${s.no} ${esc(s.name)}</option>`
  ).join("");

  $("#detail").innerHTML = `
    <h2>${esc(r.name)}</h2>
    <div class="fam">${esc(r.family)} · <code>${esc(r.id)}</code> · 判定种类 ${esc(r.kind || "未判定")}
      ${r.section ? ` · 推断章节 §${esc(r.section)}` : " · <span style='color:var(--warn)'>未推断出章节</span>"}</div>

    <div class="abbox">
      <div class="ab"><b>A 草案</b><span>${esc(cellNums(r, "A"))}</span><div class="fam">${esc(cellPage(r, "A"))}</div></div>
      <div class="ab"><b>B 现行</b><span>${esc(cellNums(r, "B"))}</span><div class="fam">${esc(cellPage(r, "B"))}</div></div>
      <div class="ab c"><b>C UN R48-09（待补）</b><span>${esc(cellNums(r, "C"))}</span><div class="fam">${esc(cellPage(r, "C"))}</div></div>
    </div>

    <section>
      <h3>候选条文（${r.candidates.length} 条）— 点「采纳」自动生成正则，请自行核对后再改</h3>
      ${r.candidates.map((c, i) => `
        <div class="cand" data-i="${i}">
          <div class="meta">
            <span>§${esc(c.clause || "?")}</span><span>p${c.page}</span>
            <span>值 ${esc(c.values.join("/"))}</span>
            ${c.overlap.length ? `<span class="star">★ 与 A/B 取值重合 ${esc(c.overlap.join("/"))}</span>` : ""}
            <span>关键词 ${esc(c.keywords.join(","))}</span>
          </div>
          <div class="txt">${esc(c.sentence)}</div>
          <div class="acts"><button class="act" data-pick="${i}">采纳这条</button></div>
        </div>`).join("") || `<div class="empty">这一行没有候选句。${esc(r.reason || "")}<br>
          若 R48 确实没有对应规定，保持留空即可 —— 留空与「抽取失败」在报告里措辞不同。</div>`}
    </section>

    <section>
      <h3>要写入 spec 的内容</h3>
      <label>归属章节（服务端会校验命中位置确实落在该章区间内）</label>
      <select id="sec">${opts}</select>
      <label>正则 source（捕获组只框住「值」）</label>
      <textarea id="src" rows="3" spellcheck="false">${esc(pk ? pk.source : "")}</textarea>
      <label>why（为什么不能用更简单的写法 —— 留给下一个人）</label>
      <textarea id="why" rows="2">${esc(pk ? pk.why : "")}</textarea>
      <div class="acts" style="margin-top:10px">
        <button class="act" id="stage">加入待采纳</button>
        <button class="act" id="unstage">从待采纳移除</button>
      </div>
    </section>`;

  $("#detail").querySelectorAll("[data-pick]").forEach((b) => {
    b.onclick = () => {
      const i = +b.dataset.pick;
      const c = r.candidates[i];
      const v = c.overlap[0] || c.values[0];
      const src = makeSource(c.sentence, v);
      if (!src) { msg("无法从这句构造锚点，请手写", true); return; }
      picked.set(r.id, {
        id: r.id, source: src, flags: "i", section: $("#sec").value,
        why: `人工确认页采纳：R48 §${c.clause || "?"}，原文「${c.sentence.slice(0, 60)}…」`,
      });
      msg("已生成正则，请核对后「加入待采纳」");
      $("#detail").querySelectorAll(".cand").forEach((el) => el.classList.toggle("pick", +el.dataset.i === i));
      $("#src").value = src;
      $("#why").value = picked.get(r.id).why;
      renderList();
    };
  });

  $("#stage").onclick = () => {
    const source = $("#src").value.trim();
    if (!source) return msg("正则不能为空", true);
    picked.set(r.id, { id: r.id, source, flags: "i", section: $("#sec").value, why: $("#why").value.trim() });
    msg(`已加入待采纳：${r.name}`);
    renderList();
  };
  $("#unstage").onclick = () => { picked.delete(r.id); msg("已移除"); renderList(); };
}

function msg(t, bad) { $("#msg").innerHTML = `<span class="${bad ? "bad" : "ok"}">${esc(t)}</span>`; }

$("#clear").onclick = () => { picked.clear(); msg("已清空"); renderList(); };
$("#save").onclick = async () => {
  const items = [...picked.values()];
  if (!items.length) return msg("待采纳列表为空", true);
  if (!confirm(`将写入 ${items.length} 条 C 模式到 data/parameter-specs.json。\n服务端会先用真实语料逐条校验，通过才落盘（原文件自动备份）。继续？`)) return;
  msg("校验中…");
  const res = await fetch("/api/parameters/proposals", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items }),
  });
  const j = await res.json();
  if (!res.ok) {
    msg(`<b>未写入任何一条</b>：` + esc(j.error) + (j.rejected ? "<br>" + j.rejected.map((x) => `· ${esc(x.id)}：${esc(x.reason)}`).join("<br>") : ""), true);
    return;
  }
  const bad = j.rejected || [];
  msg(
    `写入 ${j.accepted.length} 条` + (bad.length ? `，拒绝 ${bad.length} 条：<br>` + bad.map((x) => `· ${esc(x.id)}：${esc(x.reason)}`).join("<br>") : "")
    + `<br>备份：${esc(j.backup)}<br>下一步：<code>${esc(j.next)}</code>`,
    bad.length > 0
  );
  picked.clear();
  await load();
};

async function load() {
  const res = await fetch("/api/parameters/proposals");
  DATA = await res.json();
  $("#hstat").textContent = `待裁定 ${DATA.c.rows.length} 行 · 已有 C ${DATA.specs.filter((s) => s.patterns?.C).length} 条 · 语料${DATA.corpusLoaded ? "已载入" : "缺失"}`;
  renderList();
  if (cur) { cur = DATA.c.rows.find((r) => r.id === cur.id); renderDetail(); }
}
load();
</script>
</body>
</html>
